services:

  shibboleth.path_access_subscriber:
    class: Drupal\shibboleth_path\EventSubscriber\ShibbolethPathAccessSubscriber
    arguments: [ '@shibboleth.auth_manager', '@access_check.shibboleth_path.path_access', '@current_user', '@session_manager' ]
    tags:
      - { name: event_subscriber }

  access_check.shibboleth_path.path_access:
    class: Drupal\shibboleth_path\Access\ShibbolethPathAccessCheck
    arguments: [ '@shibboleth.auth_manager', '@cache.shibboleth', '@entity_type.manager','@page_cache_kill_switch', '@config.factory' ]

  logger.channel.shibboleth_path:
    parent: logger.channel_base
    arguments: ['shibboleth_path']

  cache.shibboleth:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin }
    factory: ['@cache_factory', 'get']
    arguments: [shibboleth]
