services:

  shibboleth_path.middleware:
    class: Drupal\shibboleth_path\StackMiddleware\ShibbolethPathMiddleware
    arguments: [ '@shibboleth.auth_manager', '@logger.factory', '@entity_type.manager', '@config.factory' ]
    tags:
      # Ensure that this comes before page caching (200), but after the ban
      # middleware (250).
      # - { name: http_middleware, priority: 200 }
      - { name: http_middleware, priority: 220 }

  # todo: Remove this?
  logger.channel.shibboleth_path:
    parent: logger.channel_base
    arguments: [ 'shibboleth_path' ]

  # todo: Remove this?
  cache.shibboleth:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin }
    factory: ['@cache_factory', 'get']
    arguments: [shibboleth]
